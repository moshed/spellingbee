name: Update NYT Spelling Bee data

on:
  schedule:
    # NYT flips the board at 3am ET, but the mirror we read only publishes it
    # between roughly 09:39 and 11:32 UTC. So: start well before the earliest
    # sighting and retry every 5 minutes until it lands. Two cheap exits keep
    # that honest -- the script returns without any network once today is in
    # nyt-bee.json, and a conditional GET makes a miss cost a few hundred bytes
    # instead of re-downloading 31MB.
    - cron: '*/5 8-17 * * *'
  workflow_dispatch:         # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-nyt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + merge NYT data
        run: python3 scripts/update-nyt.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "nyt-bee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the etag must persist across runs, or every fresh checkout
          # starts with no cached tag and re-downloads the 31MB source
          git add nyt-bee.json words.json common-words.json .nyt-upstream-etag
          if git diff --staged --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily NYT Spelling Bee data update"
            git pull --rebase --autostash origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The site is hosted on Cloudflare Pages as a direct upload, so a commit
      # alone does not publish anything. Push the files up after a data change.
      - name: Publish to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -f CLAUDE.md CLAUDE-*.md
          npx --yes wrangler@4 pages deploy . \
            --project-name spellingbee --branch main --commit-dirty=true
